<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K7</title>
<style nonce="__NONCE__">
:root {
  --bg: #f4efe6; --panel: #fffaf2; --ink: #2b2620; --muted: #7a6f62; --line: #e2d8c8;
  --deck: #2f2a25; --deck-2: #3d3630; --slot: #15120f; --accent: #e0722b; --led: #4cd964; --led-off: #4a423a;
  --shadow: 0 10px 30px rgba(60, 40, 20, .18);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16130f; --panel: #211d18; --ink: #efe7db; --muted: #a89a88; --line: #3a332b; --deck: #0e0c0a; --deck-2: #1c1814; --slot: #050403; --shadow: 0 10px 30px rgba(0, 0, 0, .5); }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
.sub { margin: 0 0 28px; color: var(--muted); text-align: center; }

/* Tocador */
.deck { width: min(520px, 100%); background: linear-gradient(180deg, var(--deck-2), var(--deck)); border-radius: 22px; padding: 22px 24px 18px; box-shadow: var(--shadow); color: #e9e1d4; position: relative; }
.deck-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.logo { font-weight: 800; font-size: 26px; letter-spacing: 2px; }
.logo span { color: var(--accent); }
.leds { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #b8ad9e; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-off); transition: background .3s, box-shadow .3s; }
.deck.playing .led { background: var(--led); box-shadow: 0 0 10px var(--led); }
.slot { height: 132px; border-radius: 12px; background: var(--slot); border: 2px solid #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.slot-empty { color: #6d6458; font-size: 14px; }
.door { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.06); transform-origin: bottom; transition: transform .45s ease; pointer-events: none; }
.deck.open .door { transform: perspective(500px) rotateX(-70deg); }
.status { margin-top: 12px; font-size: 14px; min-height: 21px; color: #cfc4b3; }
.buttons { display: flex; gap: 10px; margin-top: 10px; }
.buttons i { flex: 1; height: 14px; border-radius: 4px; background: #514840; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.deck.playing .buttons i:nth-child(2) { background: var(--accent); }

/* Fitas */
.shelf-title { margin: 34px 0 12px; font-weight: 600; color: var(--muted); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; width: min(760px, 100%); }
.tape { all: unset; cursor: pointer; display: block; }
.tape:focus-visible .cassette { outline: 3px solid var(--accent); outline-offset: 4px; }
.cassette { width: 230px; max-width: 100%; aspect-ratio: 230 / 146; transition: transform .2s ease; filter: drop-shadow(0 6px 12px rgba(40, 25, 10, .25)); }
.tape:hover .cassette { transform: translateY(-4px) rotate(-1deg); }
.desc { margin: 8px 2px 0; font-size: 14px; color: var(--muted); }
.empty { color: var(--muted); }

/* Animação: a fita escolhida voa até a gaveta */
.flying { position: fixed; z-index: 10; margin: 0; transition: transform .9s cubic-bezier(.5, 0, .2, 1); pointer-events: none; }
.reel { transform-box: fill-box; transform-origin: center; }
.deck.playing .slot .reel, .flying.spin .reel { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #d9534f; }
@media (prefers-reduced-motion: reduce) { .flying, .door, .cassette { transition: none; } .reel { animation: none !important; } }
</style>
</head>
<body>
<h1>📼 K7</h1>
<p class="sub">Escolha uma fita e coloque no tocador.</p>

<section class="deck" id="deck" aria-live="polite">
  <div class="deck-top">
    <div class="logo">K<span>7</span></div>
    <div class="leds"><span class="led"></span><span id="led-label">parado</span></div>
  </div>
  <div class="slot" id="slot"><span class="slot-empty" id="slot-empty">sem fita</span><div class="door"></div></div>
  <div class="status" id="status"></div>
  <div class="buttons" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</section>

<div class="shelf-title">Fitas disponíveis</div>
<div class="shelf" id="shelf"><p class="empty">Carregando…</p></div>

<script nonce="__NONCE__">
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['#e0722b', '#3f8fd2', '#5aa469', '#c94f7c', '#8a6fd1', '#d6a12a'];
  var busy = false;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /** Cassete desenhado em SVG (original): corpo, etiqueta com o nome, janela e dois carretéis. */
  function cassetteSvg(tape, color) {
    var spokes = function (cx) {
      return [0, 60, 120].map(function (a) {
        return '<line x1="' + cx + '" y1="66" x2="' + (cx + 13 * Math.cos(a * Math.PI / 180)) + '" y2="' + (66 + 13 * Math.sin(a * Math.PI / 180)) + '" stroke="#2b2620" stroke-width="3"/>';
      }).join('');
    };
    return '<svg class="cassette" viewBox="0 0 230 146" role="img" aria-label="Fita ' + esc(tape.titulo) + '">' +
      '<rect x="2" y="2" width="226" height="142" rx="12" fill="#2b2620"/>' +
      '<rect x="12" y="10" width="206" height="96" rx="8" fill="' + color + '"/>' +
      '<rect x="20" y="16" width="190" height="24" rx="4" fill="#fffaf2"/>' +
      '<text x="30" y="33" font-size="14" font-family="system-ui, sans-serif" font-weight="700" fill="#2b2620">' + esc(tape.emoji) + ' ' + esc(tape.titulo) + '</text>' +
      '<rect x="46" y="48" width="138" height="38" rx="19" fill="#1a1612"/>' +
      '<g class="reel"><circle cx="72" cy="66" r="15" fill="#efe7db"/>' + spokes(72) + '<circle cx="72" cy="66" r="4" fill="#2b2620"/></g>' +
      '<g class="reel"><circle cx="158" cy="66" r="15" fill="#efe7db"/>' + spokes(158) + '<circle cx="158" cy="66" r="4" fill="#2b2620"/></g>' +
      '<rect x="98" y="58" width="34" height="16" rx="3" fill="#3a332b"/>' +
      '<path d="M40 144 L56 116 H174 L190 144 Z" fill="#3a332b"/>' +
      '<circle cx="74" cy="132" r="5" fill="#15120f"/><circle cx="156" cy="132" r="5" fill="#15120f"/>' +
      '</svg>';
  }

  function setStatus(text, isError) { $('status').textContent = text; $('status').className = 'status' + (isError ? ' error' : ''); }

  function play(tape, button, color) {
    if (busy) return;
    busy = true;
    var deck = $('deck'), slot = $('slot');
    setStatus('Encaixando "' + tape.titulo + '"…');
    deck.classList.add('open');

    // A fita sai da prateleira e voa até a gaveta (FLIP: mede o começo e o fim e anima só o transform).
    var from = button.querySelector('.cassette').getBoundingClientRect();
    var to = slot.getBoundingClientRect();
    var flying = document.createElement('div');
    flying.className = 'flying spin';
    flying.innerHTML = cassetteSvg(tape, color);
    flying.style.left = from.left + 'px'; flying.style.top = from.top + 'px'; flying.style.width = from.width + 'px';
    document.body.appendChild(flying);
    var scale = Math.min((to.width - 24) / from.width, (to.height - 12) / (from.width * 146 / 230));
    var dx = to.left + (to.width - from.width * scale) / 2 - from.left;
    var dy = to.top + (to.height - from.width * 146 / 230 * scale) / 2 - from.top;
    requestAnimationFrame(function () { flying.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')'; flying.style.transformOrigin = '0 0'; });

    // Enquanto a fita voa, o site já liga o chat dela.
    var started = fetch('/api/fitas/' + encodeURIComponent(tape.nome) + '/tocar', { method: 'POST' }).then(function (res) {
      return res.json().then(function (data) { if (!res.ok) throw new Error(data.erro || ('HTTP ' + res.status)); return data; });
    });
    var landed = new Promise(function (resolve) { setTimeout(resolve, 950); });

    landed.then(function () {
      $('slot-empty').classList.add('hidden');
      $('slot-empty').style.display = 'none';
      var inside = document.createElement('div');
      inside.innerHTML = cassetteSvg(tape, color);
      inside.firstChild.style.width = Math.round(from.width * scale) + 'px';
      slot.insertBefore(inside.firstChild, slot.firstChild);
      flying.remove();
      deck.classList.remove('open');
      deck.classList.add('playing');
      $('led-label').textContent = 'tocando';
      setStatus('▶ Tocando: ' + tape.titulo);
      return started;
    }).then(function (data) {
      setTimeout(function () { location.href = data.url; }, 700);
    }).catch(function (err) {
      busy = false;
      deck.classList.remove('playing', 'open');
      $('led-label').textContent = 'parado';
      setStatus('⚠️ ' + err.message, true);
    });
  }

  fetch('/api/fitas').then(function (res) { return res.json(); }).then(function (tapes) {
    var shelf = $('shelf');
    shelf.innerHTML = '';
    if (!tapes.length) { shelf.innerHTML = '<p class="empty">Nenhuma fita liberada no momento.</p>'; return; }
    tapes.forEach(function (tape, i) {
      var color = COLORS[i % COLORS.length];
      var button = document.createElement('button');
      button.className = 'tape';
      button.type = 'button';
      button.innerHTML = cassetteSvg(tape, color) + '<p class="desc">' + esc(tape.descricao) + '</p>';
      button.onclick = function () { play(tape, button, color); };
      shelf.appendChild(button);
    });
  }).catch(function () { $('shelf').innerHTML = '<p class="empty error">Não consegui listar as fitas.</p>'; });
})();
</script>
</body>
</html>
