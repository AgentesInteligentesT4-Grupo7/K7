<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K7</title>
<style nonce="__NONCE__">
:root {
  --bg: #f4efe6; --panel: #fffaf2; --ink: #2b2620; --muted: #7a6f62; --line: #e2d8c8;
  --deck: #2f2a25; --deck-2: #3d3630; --slot: #15120f; --accent: #e0722b; --led: #4cd964; --led-off: #4a423a;
  --key: #4d443c; --key-2: #3b342e; --key-edge: #1f1a16;
  --shadow: 0 10px 30px rgba(60, 40, 20, .18);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16130f; --panel: #211d18; --ink: #efe7db; --muted: #a89a88; --line: #3a332b; --deck: #0e0c0a; --deck-2: #1c1814; --slot: #050403; --key: #2e2823; --key-2: #221d19; --key-edge: #000; --shadow: 0 10px 30px rgba(0, 0, 0, .5); }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
.sub { margin: 0 0 28px; color: var(--muted); text-align: center; }

/* Tocador */
.deck { width: min(520px, 100%); background: linear-gradient(180deg, var(--deck-2), var(--deck)); border-radius: 22px; padding: 22px 24px 20px; box-shadow: var(--shadow); color: #e9e1d4; position: relative; }
.deck-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.logo { font-weight: 800; font-size: 26px; letter-spacing: 2px; }
.logo span { color: var(--accent); }
.leds { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #b8ad9e; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-off); transition: background .3s, box-shadow .3s; }
.deck.playing .led, .deck.winding .led { background: var(--led); box-shadow: 0 0 10px var(--led); }
.deck.winding .led { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.slot { height: 132px; border-radius: 12px; background: var(--slot); border: 2px solid #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; perspective: 600px; }
.slot-empty { color: #6d6458; font-size: 14px; }
.slot .cassette { position: relative; z-index: 1; }
/* Tampa de vidro escuro: abre para a fita entrar e fecha por cima dela. */
.door { position: absolute; inset: 0; z-index: 2; border-radius: 10px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 45%, rgba(0,0,0,.18)); border: 1px solid rgba(255,255,255,.08); transform-origin: bottom; pointer-events: none; }
.status { margin-top: 12px; font-size: 14px; min-height: 21px; color: #cfc4b3; }

/* Teclas do tocador */
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.key { appearance: none; border: 0; border-radius: 7px; height: 42px; cursor: pointer; color: #e9e1d4; font: 600 15px/1 system-ui, sans-serif; background: linear-gradient(180deg, var(--key), var(--key-2)); box-shadow: 0 5px 0 var(--key-edge), inset 0 1px 0 rgba(255,255,255,.12); transition: transform .08s ease, box-shadow .08s ease, color .2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.key small { font-size: 9px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; color: #a89a88; }
.key:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.key:active, .key.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--key-edge), inset 0 2px 5px rgba(0,0,0,.45); }
.key.on { color: var(--accent); }
.key:disabled { cursor: default; opacity: .55; }

/* Fitas */
.shelf-title { margin: 34px 0 12px; font-weight: 600; color: var(--muted); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; width: min(760px, 100%); }
.tape { all: unset; cursor: pointer; display: block; }
.tape:focus-visible .cassette { outline: 3px solid var(--accent); outline-offset: 4px; }
.tape.away .cassette { visibility: hidden; }
.cassette { display: block; width: 230px; max-width: 100%; aspect-ratio: 230 / 146; transition: transform .2s ease; filter: drop-shadow(0 6px 12px rgba(40, 25, 10, .25)); }
.tape:hover .cassette { transform: translateY(-4px) rotate(-1deg); }
.desc { margin: 8px 2px 0; font-size: 14px; color: var(--muted); }
.empty { color: var(--muted); }
.shake { animation: shake .4s ease; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* A fita em voo entre a prateleira e o tocador */
.flying { position: fixed; z-index: 10; margin: 0; pointer-events: none; transform-origin: 0 0; will-change: transform; }
.reel { transform-box: fill-box; transform-origin: center; }
.deck.playing .slot .reel { animation: spin 1.1s linear infinite; }
.deck.winding.ff .slot .reel { animation: spin .3s linear infinite; }
.deck.winding.rew .slot .reel { animation: spin .3s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #d9534f; }
</style>
</head>
<body>
<h1>📼 K7</h1>
<p class="sub">Escolha uma fita e coloque no tocador.</p>

<section class="deck" id="deck" aria-label="Tocador">
  <div class="deck-top">
    <div class="logo">K<span>7</span></div>
    <div class="leds"><span class="led"></span><span id="led-label">parado</span></div>
  </div>
  <div class="slot" id="slot"><span class="slot-empty" id="slot-empty">sem fita</span><div class="door" id="door"></div></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="keys">
    <button class="key" id="k-rew" type="button" aria-label="Rebobinar">⏪<small>rebob.</small></button>
    <button class="key" id="k-play" type="button" aria-label="Tocar">▶<small>tocar</small></button>
    <button class="key" id="k-ff" type="button" aria-label="Avançar">⏩<small>avançar</small></button>
    <button class="key" id="k-stop" type="button" aria-label="Parar">⏹<small>parar</small></button>
    <button class="key" id="k-eject" type="button" aria-label="Ejetar">⏏<small>ejetar</small></button>
  </div>
</section>

<div class="shelf-title">Fitas disponíveis</div>
<div class="shelf" id="shelf"><p class="empty">Carregando…</p></div>

<script nonce="__NONCE__">
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['#e0722b', '#3f8fd2', '#5aa469', '#c94f7c', '#8a6fd1', '#d6a12a'];
  var RATIO = 146 / 230;
  // Movimento reduzido no sistema (no Windows: efeitos de animação desligados): a mesma sequência, mais curta.
  var SPEED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.6 : 1;
  var deck = $('deck'), slot = $('slot'), door = $('door');

  /** Estado do tocador: a fita na gaveta (com o botão de onde saiu), se está tocando e o que está em andamento. */
  var state = { tape: null, playing: false, busy: false, started: null, timer: 0, autoplay: false };

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms * SPEED); }); }
  /** Anima e espera acabar; se o navegador pausar a animação (aba em segundo plano), termina no tempo previsto. */
  function animate(el, frames, ms, easing) {
    var a = el.animate(frames, { duration: ms * SPEED, easing: easing || 'ease', fill: 'forwards' });
    return new Promise(function (resolve) {
      var done = false;
      var end = function () {
        if (done) return;
        done = true;
        try { a.finish(); } catch (e) { /* já terminou */ }
        resolve();
      };
      a.finished.then(end, end);
      setTimeout(end, ms * SPEED + 200);
    });
  }

  /** Cassete desenhado em SVG (original): corpo, etiqueta com o nome, janela e dois carretéis. */
  function cassetteSvg(tape, color) {
    var spokes = function (cx) {
      return [0, 60, 120].map(function (a) {
        return '<line x1="' + cx + '" y1="66" x2="' + (cx + 13 * Math.cos(a * Math.PI / 180)) + '" y2="' + (66 + 13 * Math.sin(a * Math.PI / 180)) + '" stroke="#2b2620" stroke-width="3"/>';
      }).join('');
    };
    return '<svg class="cassette" viewBox="0 0 230 146" role="img" aria-label="Fita ' + esc(tape.titulo) + '">' +
      '<rect x="2" y="2" width="226" height="142" rx="12" fill="#2b2620"/>' +
      '<rect x="12" y="10" width="206" height="96" rx="8" fill="' + color + '"/>' +
      '<rect x="20" y="16" width="190" height="24" rx="4" fill="#fffaf2"/>' +
      '<text x="30" y="33" font-size="14" font-family="system-ui, sans-serif" font-weight="700" fill="#2b2620">' + esc(tape.emoji) + ' ' + esc(tape.titulo) + '</text>' +
      '<rect x="46" y="48" width="138" height="38" rx="19" fill="#1a1612"/>' +
      '<g class="reel"><circle cx="72" cy="66" r="15" fill="#efe7db"/>' + spokes(72) + '<circle cx="72" cy="66" r="4" fill="#2b2620"/></g>' +
      '<g class="reel"><circle cx="158" cy="66" r="15" fill="#efe7db"/>' + spokes(158) + '<circle cx="158" cy="66" r="4" fill="#2b2620"/></g>' +
      '<rect x="98" y="58" width="34" height="16" rx="3" fill="#3a332b"/>' +
      '<path d="M40 144 L56 116 H174 L190 144 Z" fill="#3a332b"/>' +
      '<circle cx="74" cy="132" r="5" fill="#15120f"/><circle cx="156" cy="132" r="5" fill="#15120f"/>' +
      '</svg>';
  }

  function setStatus(text, isError) { $('status').textContent = text; $('status').className = 'status' + (isError ? ' error' : ''); }
  function setLed(text) { $('led-label').textContent = text; }

  /** A tecla afunda e volta (ou fica afundada, como o ▶ de um tocador de verdade enquanto toca). */
  function press(key, latch) {
    key.classList.add('down');
    return wait(160).then(function () { if (!latch) key.classList.remove('down'); });
  }
  function releaseKeys() { ['k-play', 'k-rew', 'k-ff'].forEach(function (id) { $(id).classList.remove('down', 'on'); }); }

  function openDoor() { return animate(door, [{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-72deg)' }], 380, 'ease-out'); }
  function closeDoor() { return animate(door, [{ transform: 'rotateX(-72deg)' }, { transform: 'rotateX(0deg)' }], 320, 'ease-in'); }

  /** Rola a página até o tocador ficar inteiro na tela (no celular ele fica acima das fitas). */
  function showDeck() {
    var r = deck.getBoundingClientRect();
    if (r.top >= 0 && r.bottom <= window.innerHeight) return Promise.resolve();
    window.scrollTo({ top: window.scrollY + r.top - 12, behavior: SPEED < 1 ? 'auto' : 'smooth' });
    return wait(450);
  }

  /** Tamanho e posição da fita dentro da gaveta. */
  function slotBox() {
    var to = slot.getBoundingClientRect();
    var width = Math.min(to.width - 24, (to.height - 14) / RATIO);
    return { left: to.left + (to.width - width) / 2, top: to.top + (to.height - width * RATIO) / 2, width: width };
  }

  /** Uma cópia da fita voa de `from` até `to` (retângulos da tela), levantando no começo e pousando no fim. */
  function fly(tape, from, to) {
    var flying = document.createElement('div');
    flying.className = 'flying';
    flying.innerHTML = cassetteSvg(tape.info, tape.color);
    flying.style.left = from.left + 'px';
    flying.style.top = from.top + 'px';
    flying.style.width = from.width + 'px';
    document.body.appendChild(flying);
    var s = to.width / from.width;
    var dx = to.left - from.left, dy = to.top - from.top;
    var lift = 'translate(0px,-14px) scale(1.06) rotate(-3deg)';
    return animate(flying, [
      { transform: 'translate(0px,0px) scale(1) rotate(0deg)', offset: 0 },
      { transform: lift, offset: 0.18 },
      { transform: 'translate(' + dx * 0.55 + 'px,' + (dy * 0.55 - 40) + 'px) scale(' + (1 + (s - 1) * 0.6) + ') rotate(4deg)', offset: 0.6 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(0deg)', offset: 1 },
    ], 950, 'cubic-bezier(.45,0,.25,1)').then(function () { return flying; });
  }

  /** Põe a fita na gaveta (desenho fixo dentro do tocador). */
  function seat(tape, width) {
    var holder = document.createElement('div');
    holder.innerHTML = cassetteSvg(tape.info, tape.color);
    var svg = holder.firstChild;
    svg.style.width = Math.round(width) + 'px';
    svg.id = 'seated';
    slot.insertBefore(svg, door);
    $('slot-empty').style.display = 'none';
    return svg;
  }

  /** Clique numa fita: ela sai da prateleira, a tampa abre, ela entra, a tampa fecha e o ▶ é apertado. */
  function insert(tape) {
    if (state.busy) return;
    var swap = state.tape && state.tape !== tape ? eject() : Promise.resolve();
    if (state.tape === tape) { play(); return; }
    state.busy = true;
    swap.then(function () {
      state.busy = true;
      state.autoplay = true;
      return showDeck();
    }).then(function () {
      setStatus('Encaixando "' + tape.info.titulo + '"…');
      // Enquanto a fita voa, o site já prepara o chat dela.
      state.started = fetch('/api/fitas/' + encodeURIComponent(tape.info.nome) + '/tocar', { method: 'POST' }).then(function (res) {
        return res.json().then(function (data) { if (!res.ok) throw new Error(data.erro || 'Não consegui ligar esta fita agora.'); return data; });
      });
      state.started.catch(function () {});
      var from = tape.button.querySelector('.cassette').getBoundingClientRect();
      tape.button.classList.add('away');
      return Promise.all([openDoor(), wait(120).then(function () { return fly(tape, from, slotBox()); })]);
    }).then(function (done) {
      var flying = done[1];
      seat(tape, slotBox().width);
      flying.remove();
      state.tape = tape;
      return closeDoor();
    }).then(function () {
      state.busy = false;
      // ⏹ ou ⏏ apertados durante o encaixe: a fita fica parada na gaveta.
      if (!state.autoplay) { setStatus('⏹ Parado: ' + tape.info.titulo + '. Aperte ▶ para tocar.'); return; }
      return wait(220).then(function () { if (state.autoplay) play(); });
    }).catch(function (err) { fail(err); });
  }

  /** ▶: a tecla fica afundada, os carretéis giram e, logo depois, abre o chat da fita. */
  function play() {
    state.autoplay = false;
    if (state.busy) return;
    if (!state.tape) { press($('k-play')); setStatus('Escolha uma fita na prateleira.'); $('shelf').classList.remove('shake'); void $('shelf').offsetWidth; $('shelf').classList.add('shake'); return; }
    releaseKeys();
    deck.classList.remove('winding', 'ff', 'rew');
    $('k-play').classList.add('on');
    press($('k-play'), true);
    deck.classList.add('playing');
    state.playing = true;
    setLed('tocando');
    setStatus('▶ Tocando: ' + state.tape.info.titulo);
    var tape = state.tape;
    clearTimeout(state.timer);
    state.timer = setTimeout(function () {
      (state.started || Promise.reject(new Error('Não consegui ligar esta fita agora.'))).then(function (data) {
        if (state.playing && state.tape === tape) location.href = data.url;
      }).catch(function (err) { fail(err); });
    }, 1100);
  }

  /** ⏹: para os carretéis e não abre o chat. */
  function stop() {
    clearTimeout(state.timer);
    state.autoplay = false;
    press($('k-stop'));
    releaseKeys();
    deck.classList.remove('playing', 'winding', 'ff', 'rew');
    state.playing = false;
    setLed('parado');
    if (state.tape) setStatus('⏹ Parado: ' + state.tape.info.titulo + '. Aperte ▶ para tocar.');
  }

  /** ⏪ / ⏩: carretéis girando rápido por um instante. */
  function wind(dir) {
    if (state.busy) return;
    var key = $(dir === 'ff' ? 'k-ff' : 'k-rew');
    if (!state.tape) { press(key); setStatus('Sem fita no tocador.'); return; }
    clearTimeout(state.timer);
    state.playing = false;
    releaseKeys();
    deck.classList.remove('playing', 'ff', 'rew');
    deck.classList.add('winding', dir);
    key.classList.add('on');
    press(key, true);
    setLed(dir === 'ff' ? 'avançando' : 'rebobinando');
    setStatus(dir === 'ff' ? '⏩ Avançando…' : '⏪ Rebobinando…');
    clearTimeout(state.wind);
    state.wind = setTimeout(function () { if (deck.classList.contains(dir)) stop(); }, 1400);
  }

  /** ⏏: a tampa abre e a fita volta para o lugar dela na prateleira. */
  function eject() {
    if (state.busy && !state.tape) return Promise.resolve();
    clearTimeout(state.timer);
    press($('k-eject'));
    releaseKeys();
    deck.classList.remove('playing', 'winding', 'ff', 'rew');
    state.playing = false;
    setLed('parado');
    var tape = state.tape;
    if (!tape) { setStatus('Sem fita no tocador.'); return Promise.resolve(); }
    state.busy = true;
    setStatus('⏏ Ejetando…');
    return openDoor().then(function () {
      var seated = $('seated');
      var from = seated.getBoundingClientRect();
      seated.remove();
      state.tape = null;
      state.started = null;
      var back = tape.button.querySelector('.cassette').getBoundingClientRect();
      return fly(tape, from, { left: back.left, top: back.top, width: back.width });
    }).then(function (flying) {
      tape.button.classList.remove('away');
      flying.remove();
      $('slot-empty').style.display = '';
      setStatus('');
      return closeDoor();
    }).then(function () { state.busy = false; });
  }

  function fail(err) {
    clearTimeout(state.timer);
    state.busy = false;
    state.playing = false;
    releaseKeys();
    deck.classList.remove('playing', 'winding', 'ff', 'rew');
    setLed('parado');
    setStatus('⚠️ ' + (err && err.message ? err.message : 'Algo deu errado.'), true);
  }

  $('k-play').onclick = play;
  $('k-stop').onclick = stop;
  $('k-eject').onclick = function () { if (!state.busy) eject(); };
  $('k-ff').onclick = function () { wind('ff'); };
  $('k-rew').onclick = function () { wind('rew'); };

  // Voltar do chat pelo botão do navegador: a página volta da memória; a fita fica na gaveta, parada.
  window.addEventListener('pageshow', function (e) { if (e.persisted) { state.busy = false; stop(); } });

  fetch('/api/fitas').then(function (res) { return res.json(); }).then(function (tapes) {
    var shelf = $('shelf');
    shelf.innerHTML = '';
    if (!tapes.length) { shelf.innerHTML = '<p class="empty">Nenhuma fita liberada no momento.</p>'; return; }
    tapes.forEach(function (info, i) {
      var tape = { info: info, color: COLORS[i % COLORS.length], button: document.createElement('button') };
      tape.button.className = 'tape';
      tape.button.type = 'button';
      tape.button.innerHTML = cassetteSvg(info, tape.color) + '<p class="desc">' + esc(info.descricao) + '</p>';
      tape.button.onclick = function () { insert(tape); };
      shelf.appendChild(tape.button);
    });
  }).catch(function () { $('shelf').innerHTML = '<p class="empty error">Não consegui listar as fitas.</p>'; });
})();
</script>
</body>
</html>
